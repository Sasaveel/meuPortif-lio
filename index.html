    <!-- Lógica do Carrossel -->
    <script>
        // Dados do Portfólio atualizados com a ordem correta e a propriedade 'isLogo'
        const portifolioData = [
            {
                src: "mil hojitas.png",
                desc: "Conceito de poster para musica - feito no Adobe Photoshop",
                isLogo: false
            },
            {
                src: "Mesa de trabajo 1@2x.png",
                desc: "Logotipo para a estética automotiva \"João Detailer\" feito no Adobe Illustrator",
                isLogo: true // Aplica a máscara de círculo
            },
            {
                src: "LogoDivEm3-Recuperados.jpg",
                desc: "Logotipo feito para loja virtual de videogames - feito no Adobe Illustrator",
                isLogo: true // Aplica a máscara de círculo
            },
            {
                src: "SSSSSSSSSSSSSS copiaD.png",
                desc: "Banner para loja virtual com informações - feito no Adobe Illustrator",
                isLogo: false
            },
            {
                src: "120 do j.png",
                desc: "Post para vendas - feito no Adobe Photoshop",
                isLogo: false
            }
        ];

        let currentIndex = 0;
        const imgElement = document.getElementById('carousel-img');
        const descElement = document.getElementById('carousel-desc');
        const indicatorsContainer = document.getElementById('indicators');

        // Cria os indicadores (bolinhas)
        function createIndicators() {
            indicatorsContainer.innerHTML = '';
            portifolioData.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.onclick = () => goToSlide(index);
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === currentIndex ? 'bg-gray-300 scale-125' : 'bg-zinc-700 hover:bg-zinc-500'}`;
                dot.setAttribute('aria-label', `Ir para a imagem ${index + 1}`);
                indicatorsContainer.appendChild(dot);
            });
        }

        // Aplica estilos diferentes se for logo ou arte normal
        function applyImageStyles(isLogo) {
            if (isLogo) {
                // Classes para logos: Círculo perfeito, proporção 1:1 e sombra legal
                imgElement.className = "fade-in w-full max-w-[280px] md:max-w-[380px] aspect-square object-cover rounded-full shadow-[0_0_40px_rgba(0,0,0,0.6)] border-[4px] border-zinc-800/80";
            } else {
                // Classes para artes normais (adapta sem cortar)
                imgElement.className = "fade-in max-w-full max-h-full object-contain drop-shadow-lg rounded-md";
            }
        }

        // Atualiza a interface
        function updateCarousel() {
            // Remove a classe de animação para reiniciar
            imgElement.classList.remove('fade-in');
            descElement.classList.remove('fade-in');
            
            // Força um pequeno delay para a re-renderização do CSS
            void imgElement.offsetWidth; 
            
            // Atualiza dados
            const currentItem = portifolioData[currentIndex];
            imgElement.src = currentItem.src;
            descElement.textContent = currentItem.desc;
            
            // Aplica os estilos dependendo se é logo ou não
            applyImageStyles(currentItem.isLogo);
            descElement.classList.add('fade-in');

            createIndicators();
        }

        // Funções de navegação
        function nextSlide() {
            currentIndex = (currentIndex + 1) % portifolioData.length;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + portifolioData.length) % portifolioData.length;
            updateCarousel();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateCarousel();
        }

        // Suporte para navegação pelo teclado (Setas direita e esquerda)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Inicializa o carrossel ao carregar a página
        updateCarousel();
    </script>
